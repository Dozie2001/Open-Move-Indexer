[package]
name = "indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
sui_data_ingestion_core = { git = "https://github.com/mystenlabs/sui", package = "sui-data-ingestion-core"}
sui_types = { git = "https://github.com/mystenlabs/sui", package = "sui-types"}
tokio = { version = "1.38.0", features = ["full"]}
async-trait = "0.1.83"
prometheus = "0.13.3"
anyhow = "1.0.86"
# Database - for tracking processed checkpoints only
sqlx = { version = "0.7.3", features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "uuid"] }
chrono = { version = "0.4.35", features = ["serde"] }
dotenv = "0.15.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
thiserror = "1.0.58"
uuid = { version = "1.7.0", features = ["v4", "serde"] }
# Config
config = "0.14.0"
once_cell = "1.19.0"
# RabbitMQ
lapin = "2.3.1"
